entity_type: cost_item
module: cost
name: 成本项
icon: money
icon_color: "#F56C6C"
fields:
  - {field_key: code, field_label: 成本编号, data_type: string}
  - {field_key: wbs_node_id, field_label: WBS节点, data_type: ref}
  - {field_key: budget_type, field_label: 预算类型, data_type: enum, options_json: '["labor","material","expense","equipment"]'}
  - {field_key: planned_value, field_label: 计划价值(PV), data_type: decimal}
  - {field_key: earned_value, field_label: 挣值(EV), data_type: decimal, default_value: "0"}
  - {field_key: actual_cost, field_label: 实际成本(AC), data_type: decimal, default_value: "0"}
  - {field_key: planned_start, field_label: 计划开始, data_type: date}
  - {field_key: planned_finish, field_label: 计划完成, data_type: date}
  - {field_key: currency, field_label: 币种, data_type: string, default_value: CNY}
states: [planned, in_progress, closed, over_budget]
workflows: [cost_baseline]
