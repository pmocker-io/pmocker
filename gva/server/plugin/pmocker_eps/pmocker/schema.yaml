entity_types:
  - entity_type: eps_node
    module: eps
    name: EPS节点
    icon: account_tree
    icon_color: "#909399"
    fields:
      - {field_key: code, field_label: 编码, data_type: string}
      - {field_key: name, field_label: 名称, data_type: string}
      - {field_key: type, field_label: 类型, data_type: enum, options_json: '["group","division","department","project_group","project"]'}
      - {field_key: parent_path, field_label: 父路径, data_type: string}
      - {field_key: sort, field_label: 排序, data_type: int}
      - {field_key: manager_id, field_label: 负责人, data_type: ref}
      - {field_key: description, field_label: 描述, data_type: text}
      - {field_key: is_active, field_label: 是否启用, data_type: bool, default_value: true}
    states: [draft, active, inactive]
    workflows: [eps_node_approve]

  - entity_type: eps_member
    module: eps
    name: EPS成员
    icon: user
    icon_color: "#409EFF"
    fields:
      - {field_key: eps_node_id, field_label: EPS节点ID, data_type: ref}
      - {field_key: user_id, field_label: 用户ID, data_type: ref}
      - {field_key: role, field_label: 角色, data_type: enum, options_json: '["owner","manager","member","viewer"]'}
      - {field_key: start_date, field_label: 开始日期, data_type: date}
      - {field_key: end_date, field_label: 结束日期, data_type: date}
    states: [active, inactive]
