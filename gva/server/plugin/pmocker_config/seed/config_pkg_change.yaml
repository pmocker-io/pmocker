entity_type: change_request
module: change
name: 变更管理
fields:
    - key: code
      label: 变更编号
      data_type: string
    - key: title
      label: 标题
      data_type: string
    - key: type
      label: 类型
      data_type: enum
      options:
        - scope
        - schedule
        - cost
        - quality
        - resource
        - risk
        - other
    - key: priority
      label: 优先级
      data_type: enum
      options:
        - critical
        - high
        - medium
        - low
    - key: description
      label: 变更描述
      data_type: text
    - key: reason
      label: 变更原因
      data_type: text
    - key: requested_by
      label: 申请人
      data_type: user
    - key: requested_date
      label: 申请日期
      data_type: date
    - key: impact_scope
      label: 影响范围
      data_type: text
    - key: impact_schedule
      label: 进度影响(天)
      data_type: int
    - key: impact_cost
      label: 成本影响
      data_type: decimal
    - key: impact_quality
      label: 质量影响
      data_type: text
    - key: ccb_decision
      label: CCB决议
      data_type: text
    - key: implemented_by
      label: 实施人
      data_type: user
    - key: implemented_date
      label: 实施日期
      data_type: date
    - key: validation_result
      label: 验证结果
      data_type: text
    - key: change_nature
      label: 变更性质
      data_type: enum
      options:
        - corrective
        - preventive
        - defect_repair
        - enhancement
    - key: ccb_decision_date
      label: CCB决议日期
      data_type: date
    - key: ccb_decision_maker
      label: CCB决议人
      data_type: user
    - key: impact_analyzed_by
      label: 影响分析人
      data_type: user
    - key: validated_by
      label: 验证人
      data_type: user
    - key: is_emergency
      label: 是否紧急变更
      data_type: bool
      default: "false"
    - key: affected_baselines
      label: 受影响基线
      data_type: json
    - key: baseline_snapshot
      label: 基线快照
      data_type: json
states:
    - status: draft
      label: 草稿
      tag_type: info
    - status: submitted
      label: 已提交
      tag_type: warning
    - status: analyzing
      label: analyzing
      tag_type: info
    - status: ccb_review
      label: CCB评审
      tag_type: warning
    - status: approved
      label: 已批准
      tag_type: success
    - status: rejected
      label: 已驳回
      tag_type: danger
    - status: implementing
      label: 实施中
      tag_type: warning
    - status: verified
      label: 已验证
      tag_type: success
    - status: closed
      label: 已关闭
      tag_type: success
    - status: cancelled
      label: 已取消
      tag_type: info
transitions:
    - from: draft
      to: submitted
      action: submit
    - from: submitted
      to: approved
      action: approve
    - from: submitted
      to: draft
      action: reject
      rollback: true
projects:
