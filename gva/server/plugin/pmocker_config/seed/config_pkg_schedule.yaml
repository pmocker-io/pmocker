entity_type: task
module: schedule
name: 进度管理
fields:
    - key: code
      label: 任务编号
      data_type: string
    - key: wbs_node_id
      label: WBS节点
      data_type: ref
    - key: start_date
      label: 开始日期
      data_type: date
    - key: end_date
      label: 结束日期
      data_type: date
    - key: duration
      label: 工期(天)
      data_type: int
    - key: progress
      label: 完成度%
      data_type: decimal
      default: "0"
    - key: assignee_id
      label: 负责人
      data_type: user
    - key: predecessors
      label: 前置任务
      data_type: json
    - key: successors
      label: 后置任务
      data_type: json
    - key: constraint_type
      label: 约束类型
      data_type: enum
      options:
        - ASAP
        - ALAP
        - SNET
        - FNLT
    - key: constraint_date
      label: 约束日期
      data_type: date
    - key: dependency_type
      label: 依赖类型
      data_type: enum
      options:
        - FS
        - FF
        - SS
        - SF
    - key: lead_lag
      label: 提前量/滞后量(天)
      data_type: int
    - key: resource_assignments
      label: 资源加载
      data_type: json
    - key: is_critical_path
      label: 是否关键路径
      data_type: bool
      default: "false"
    - key: total_float
      label: 总浮动时间(天)
      data_type: decimal
    - key: free_float
      label: 自由浮动时间(天)
      data_type: decimal
    - key: baseline_start
      label: 基线开始日期
      data_type: date
    - key: baseline_finish
      label: 基线完成日期
      data_type: date
    - key: actual_start
      label: 实际开始日期
      data_type: date
    - key: actual_finish
      label: 实际完成日期
      data_type: date
    - key: task_type
      label: 任务类型
      data_type: enum
      options:
        - fixed_duration
        - fixed_work
        - fixed_units
    - key: deliverable_id
      label: 关联交付物
      data_type: ref
states:
    - status: planned
      label: 计划中
      tag_type: info
    - status: in_progress
      label: 处理中
      tag_type: warning
    - status: completed
      label: 已完成
      tag_type: success
    - status: overdue
      label: 已逾期
      tag_type: danger
transitions: []
