entity_type: scope_item
module: scope
name: 范围管理
fields:
    - key: code
      label: 范围编号
      data_type: string
    - key: wbs_path
      label: WBS路径
      data_type: string
    - key: is_deliverable
      label: 是否交付物
      data_type: bool
      default: "false"
    - key: description
      label: 描述
      data_type: text
    - key: parent_id
      label: 父范围项
      data_type: ref
    - key: wbs_code
      label: WBS编码
      data_type: string
    - key: is_work_package
      label: 是否工作包
      data_type: bool
      default: "false"
    - key: raci_responsible
      label: RACI-执行人(R)
      data_type: user
    - key: raci_accountable
      label: RACI-负责人(A)
      data_type: user
    - key: raci_consulted
      label: RACI-咨询人(C)
      data_type: json
    - key: raci_informed
      label: RACI-知会人(I)
      data_type: json
    - key: baseline_version
      label: 范围基线版本
      data_type: string
    - key: baseline_date
      label: 基线日期
      data_type: date
    - key: acceptance_status
      label: 范围确认状态
      data_type: enum
      options:
        - pending
        - accepted
        - rejected
    - key: assumptions
      label: 假设条件
      data_type: text
    - key: constraints
      label: 制约因素
      data_type: text
    - key: exclusions
      label: 范围排除项
      data_type: text
states:
    - status: draft
      label: 草稿
      tag_type: info
    - status: baselined
      label: baselined
      tag_type: info
    - status: changed
      label: changed
      tag_type: info
transitions: []
projects:
    - code: PROJ_A
      name: 智能排产系统研发
      type: project
      status: active
      priority: 1
      entities:
        scope_item:
            - code: S1
              name: 1.项目管理
              parent: ""
            - code: S2
              name: 2.需求调研
              parent: S1
            - code: S3
              name: 3.系统设计
              parent: S1
            - code: S4
              name: 4.开发实施
              parent: S1
            - code: S5
              name: 5.测试验收
              parent: S1
    - code: PROJ_B
      name: 新建厂房工程
      type: project
      status: active
      priority: 0
      entities:
        scope_item:
            - code: W1
              name: 前期准备
              parent: ""
            - code: W2
              name: 基础施工
              parent: ""
            - code: W3
              name: 主体结构
              parent: ""
            - code: W4
              name: 机电安装
              parent: ""
            - code: W5
              name: 装饰装修
              parent: ""
            - code: W6
              name: 验收交付
              parent: ""
    - code: PROJ_C
      name: 高精度温度传感器研发
      type: project
      status: active
      priority: 1
      entities:
        scope_item:
            - code: C1
              name: 概念开发
              parent: ""
            - code: C2
              name: 详细设计
              parent: ""
            - code: C3
              name: 原型试制
              parent: ""
            - code: C4
              name: 验证测试
              parent: ""
            - code: C5
              name: 转产固化
              parent: ""
