entity_type: risk
module: risk
name: 风险管理
fields:
    - key: code
      label: 风险编号
      data_type: string
    - key: category
      label: 类别
      data_type: enum
      options:
        - technical
        - external
        - organizational
        - project_management
    - key: description
      label: 风险描述
      data_type: text
    - key: probability
      label: 发生概率(1-5)
      data_type: int
    - key: impact
      label: 影响程度(1-5)
      data_type: int
    - key: risk_score
      label: 风险分值
      data_type: int
    - key: risk_level
      label: 风险等级
      data_type: enum
      options:
        - low
        - medium
        - high
        - critical
    - key: response_strategy
      label: 负面风险应对策略
      data_type: enum
      options:
        - avoid
        - mitigate
        - transfer
        - accept
        - escalate
    - key: response_plan
      label: 应对计划
      data_type: text
    - key: trigger_condition
      label: 触发条件
      data_type: text
    - key: owner_id
      label: 责任人
      data_type: user
    - key: due_date
      label: 应对截止日
      data_type: date
    - key: status
      label: 状态
      data_type: enum
      options:
        - identified
        - assessed
        - responding
        - closed
        - realized
    - key: opportunity_strategy
      label: 机会应对策略
      data_type: enum
      options:
        - exploit
        - share
        - enhance
        - accept
        - escalate
    - key: expected_monetary_value
      label: EMV预期货币值
      data_type: decimal
    - key: impact_amount
      label: 影响金额
      data_type: decimal
    - key: contingency_reserve
      label: 应急储备
      data_type: decimal
    - key: secondary_risk_id
      label: 次生风险
      data_type: ref
    - key: residual_risk
      label: 残余风险描述
      data_type: text
    - key: identified_date
      label: 识别日期
      data_type: date
    - key: reassessment_date
      label: 再评估日期
      data_type: date
    - key: analysis_type
      label: 分析类型
      data_type: enum
      options:
        - qualitative
        - quantitative
    - key: response_cost
      label: 应对成本
      data_type: decimal
states:
    - status: identified
      label: 已识别
      tag_type: info
    - status: assessed
      label: assessed
      tag_type: info
    - status: responding
      label: 应对中
      tag_type: warning
    - status: closed
      label: 已关闭
      tag_type: success
    - status: realized
      label: realized
      tag_type: info
transitions: []
