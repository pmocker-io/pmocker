entity_type: team_member
module: team
name: 团队管理
fields:
    - key: code
      label: 成员编号
      data_type: string
    - key: user_id
      label: 关联用户
      data_type: ref
    - key: full_name
      label: 姓名
      data_type: string
    - key: role
      label: 角色
      data_type: enum
      options:
        - pm
        - sponsor
        - ba
        - dev
        - qa
        - designer
        - architect
        - sme
    - key: department
      label: 部门
      data_type: string
    - key: allocation_percent
      label: 投入比例(%)
      data_type: decimal
    - key: start_date
      label: 开始日期
      data_type: date
    - key: end_date
      label: 结束日期
      data_type: date
    - key: skills
      label: 技能
      data_type: json
    - key: skill_level
      label: 技能等级
      data_type: enum
      options:
        - junior
        - mid
        - senior
        - expert
    - key: certifications
      label: 认证
      data_type: json
    - key: hourly_rate
      label: 时薪
      data_type: decimal
    - key: cost_center
      label: 成本中心
      data_type: string
    - key: billable
      label: 是否计费
      data_type: bool
      default: "false"
    - key: location
      label: 所在地
      data_type: string
    - key: timezone
      label: 时区
      data_type: string
    - key: communication_mode
      label: 工作模式
      data_type: enum
      options:
        - onsite
        - hybrid
        - remote
    - key: reporting_to
      label: 汇报对象
      data_type: user
    - key: performance_rating
      label: 绩效评分
      data_type: decimal
    - key: utilization_rate
      label: 利用率(%)
      data_type: decimal
    - key: status
      label: 状态
      data_type: enum
      options:
        - candidate
        - onboarded
        - active
        - leaving
        - offboarded
    - key: offboard_reason
      label: 离职原因
      data_type: text
states:
    - status: candidate
      label: candidate
      tag_type: info
    - status: onboarded
      label: onboarded
      tag_type: info
    - status: active
      label: 进行中
      tag_type: info
    - status: leaving
      label: leaving
      tag_type: info
    - status: offboarded
      label: offboarded
      tag_type: info
