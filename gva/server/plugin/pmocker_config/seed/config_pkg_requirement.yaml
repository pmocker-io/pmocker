entity_type: requirement
module: requirement
name: 需求管理
fields:
    - key: code
      label: 需求编号
      data_type: string
    - key: priority
      label: 优先级
      data_type: enum
      options:
        - 高
        - 中
        - 低
      default: 中
    - key: source
      label: 来源
      data_type: enum
      options:
        - 客户
        - 市场
        - 内部
        - 合规
    - key: category
      label: 分类
      data_type: enum
      options:
        - 功能
        - 非功能
        - 约束
    - key: description
      label: 详细描述
      data_type: text
    - key: acceptance_criteria
      label: 验收标准
      data_type: text
    - key: estimated_effort
      label: 预估工时(人日)
      data_type: decimal
    - key: assignee
      label: 责任人
      data_type: user
    - key: planned_release
      label: 计划发布版本
      data_type: string
    - key: moscow_priority
      label: MoSCoW优先级
      data_type: enum
      options:
        - must
        - should
        - could
        - wont
    - key: requirement_type
      label: 需求类型
      data_type: enum
      options:
        - business
        - user
        - system
        - feature
        - non_functional
    - key: verification_method
      label: 验证方式
      data_type: enum
      options:
        - inspection
        - demonstration
        - test
        - analysis
    - key: traceability_links
      label: 追踪关系
      data_type: json
    - key: baseline_version
      label: 需求基线版本
      data_type: string
    - key: baseline_date
      label: 基线日期
      data_type: date
    - key: status
      label: 需求状态
      data_type: enum
      options:
        - draft
        - reviewing
        - approved
        - rejected
        - fulfilled
    - key: requested_by
      label: 需求提出人
      data_type: user
    - key: requested_date
      label: 提出日期
      data_type: date
    - key: agile_level
      label: 敏捷层级
      data_type: enum
      options:
        - epic
        - story
        - task
    - key: story_points
      label: 故事点
      data_type: decimal
    - key: stakeholder_id
      label: 干系人
      data_type: user
states:
    - status: draft
      label: 草稿
      tag_type: info
    - status: reviewing
      label: 评审中
      tag_type: warning
    - status: approved
      label: 已批准
      tag_type: success
    - status: rejected
      label: 已驳回
      tag_type: danger
    - status: fulfilled
      label: 已履行
      tag_type: success
transitions:
    - from: draft
      to: reviewing
      action: submit
    - from: reviewing
      to: published
      action: approve
    - from: reviewing
      to: draft
      action: reject
      rollback: true
projects:
