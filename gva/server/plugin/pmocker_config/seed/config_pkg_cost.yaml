entity_type: cost_item
module: cost
name: 成本管理
fields:
    - key: code
      label: 成本编号
      data_type: string
    - key: wbs_node_id
      label: WBS节点
      data_type: ref
    - key: budget_type
      label: 预算类型
      data_type: enum
      options:
        - labor
        - material
        - expense
        - equipment
    - key: planned_value
      label: 计划价值(PV)
      data_type: decimal
    - key: earned_value
      label: 挣值(EV)
      data_type: decimal
      default: "0"
    - key: actual_cost
      label: 实际成本(AC)
      data_type: decimal
      default: "0"
    - key: planned_start
      label: 计划开始
      data_type: date
    - key: planned_finish
      label: 计划完成
      data_type: date
    - key: currency
      label: 币种
      data_type: string
      default: CNY
    - key: bac
      label: 完工预算(BAC)
      data_type: decimal
    - key: cv
      label: 成本偏差(CV)
      data_type: decimal
      default: "0"
    - key: sv
      label: 进度偏差(SV)
      data_type: decimal
      default: "0"
    - key: cpi
      label: 成本绩效指数(CPI)
      data_type: decimal
      default: "0"
    - key: spi
      label: 进度绩效指数(SPI)
      data_type: decimal
      default: "0"
    - key: eac
      label: 完工估算(EAC)
      data_type: decimal
    - key: etc
      label: 完工尚需估算(ETC)
      data_type: decimal
    - key: vac
      label: 完工偏差(VAC)
      data_type: decimal
    - key: tcpi
      label: 完工尚需绩效指数(TCPI)
      data_type: decimal
    - key: estimation_method
      label: 估算方法
      data_type: enum
      options:
        - analogous
        - parametric
        - bottom_up
        - three_point
    - key: contingency_reserve
      label: 应急储备
      data_type: decimal
      default: "0"
    - key: management_reserve
      label: 管理储备
      data_type: decimal
      default: "0"
    - key: baseline_version
      label: 成本基线版本
      data_type: string
    - key: baseline_date
      label: 基线日期
      data_type: date
    - key: actual_date
      label: 实际发生日期
      data_type: date
    - key: variance_reason
      label: 偏差原因分析
      data_type: text
states:
    - status: planned
      label: 计划中
      tag_type: info
    - status: in_progress
      label: 处理中
      tag_type: warning
    - status: closed
      label: 已关闭
      tag_type: success
    - status: over_budget
      label: over_budget
      tag_type: info
transitions: []
