entity_type: issue
module: issue
name: 问题管理
fields:
    - key: code
      label: 问题编号
      data_type: string
    - key: title
      label: 标题
      data_type: string
    - key: description
      label: 描述
      data_type: text
    - key: priority
      label: 优先级
      data_type: enum
      options:
        - 紧急
        - 高
        - 中
        - 低
    - key: severity
      label: 严重程度
      data_type: enum
      options:
        - fatal
        - critical
        - major
        - minor
        - trivial
    - key: category
      label: 分类
      data_type: enum
      options:
        - bug
        - performance
        - usability
        - process
        - schedule
        - resource
        - communication
        - other
    - key: assignee
      label: 指派给
      data_type: user
    - key: reported_by
      label: 报告人
      data_type: user
    - key: due_date
      label: 截止日期
      data_type: date
    - key: resolution
      label: 解决方案
      data_type: text
    - key: root_cause
      label: 根本原因
      data_type: text
    - key: status
      label: 状态
      data_type: enum
      options:
        - open
        - assigned
        - in_progress
        - resolved
        - verified
        - closed
        - reopened
    - key: closure_criteria
      label: 关闭条件
      data_type: text
    - key: affected_scope
      label: 影响范围
      data_type: ref
    - key: resolution_type
      label: 解决类型
      data_type: enum
      options:
        - workaround
        - permanent_fix
    - key: related_risk_id
      label: 关联风险
      data_type: ref
    - key: resolved_date
      label: 解决日期
      data_type: date
    - key: resolution_effort
      label: 解决工时
      data_type: decimal
    - key: verified_by
      label: 验证人
      data_type: user
    - key: verified_date
      label: 验证日期
      data_type: date
    - key: reopen_count
      label: 重开次数
      data_type: int
      default: "0"
states:
    - status: open
      label: 待处理
      tag_type: info
    - status: assigned
      label: 已指派
      tag_type: warning
    - status: in_progress
      label: 处理中
      tag_type: warning
    - status: resolved
      label: 已解决
      tag_type: success
    - status: verified
      label: 已验证
      tag_type: success
    - status: closed
      label: 已关闭
      tag_type: success
    - status: reopened
      label: 已重开
      tag_type: danger
transitions: []
