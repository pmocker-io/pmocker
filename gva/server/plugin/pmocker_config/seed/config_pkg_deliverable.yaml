entity_type: deliverable
module: deliverable
name: 交付物管理
fields:
    - key: code
      label: 交付物编号
      data_type: string
    - key: name
      label: 名称
      data_type: string
    - key: category
      label: 分类
      data_type: enum
      options:
        - document
        - software
        - hardware
        - service
        - training
    - key: description
      label: 描述
      data_type: text
    - key: version
      label: 版本
      data_type: string
      default: "1.0"
    - key: format
      label: 格式
      data_type: string
    - key: owner_id
      label: 负责人
      data_type: user
    - key: planned_date
      label: 计划提交日期
      data_type: date
    - key: actual_date
      label: 实际提交日期
      data_type: date
    - key: reviewer_id
      label: 验收人
      data_type: user
    - key: acceptance_criteria
      label: 验收标准
      data_type: text
    - key: file_ref
      label: 附件引用
      data_type: string
    - key: related_requirements
      label: 关联需求
      data_type: json
    - key: config_item_id
      label: 配置项ID
      data_type: string
    - key: review_status
      label: 评审状态
      data_type: enum
      options:
        - not_started
        - in_review
        - approved
        - changes_requested
    - key: wbs_node_id
      label: 关联WBS节点
      data_type: ref
    - key: defect_count
      label: 缺陷数
      data_type: int
      default: "0"
    - key: security_classification
      label: 保密级别
      data_type: enum
      options:
        - public
        - internal
        - confidential
        - secret
    - key: lock_status
      label: 锁定状态
      data_type: enum
      options:
        - available
        - checked_out
      default: available
    - key: checked_out_by
      label: 检出人
      data_type: user
    - key: checked_out_at
      label: 检出时间
      data_type: datetime
states:
    - status: draft
      label: 草稿
      tag_type: info
    - status: submitted
      label: 已提交
      tag_type: warning
    - status: reviewing
      label: 评审中
      tag_type: warning
    - status: accepted
      label: 已接收
      tag_type: success
    - status: rejected
      label: 已驳回
      tag_type: danger
    - status: baselined
      label: baselined
      tag_type: info
    - status: obsolete
      label: obsolete
      tag_type: info
transitions:
    - from: draft
      to: reviewing
      action: submit
    - from: reviewing
      to: published
      action: approve
    - from: reviewing
      to: draft
      action: reject
      rollback: true
