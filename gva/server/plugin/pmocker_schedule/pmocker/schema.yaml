entity_types:
  - entity_type: task
    module: schedule
    name: 任务
    icon: calendar
    icon_color: "#E6A23C"
    fields:
      - {field_key: code, field_label: 任务编号, data_type: string}
      - {field_key: wbs_node_id, field_label: WBS节点, data_type: ref}
      - {field_key: start_date, field_label: 开始日期, data_type: date}
      - {field_key: end_date, field_label: 结束日期, data_type: date}
      - {field_key: duration, field_label: 工期(天), data_type: int}
      - {field_key: progress, field_label: 完成度%, data_type: decimal, default_value: "0"}
      - {field_key: assignee_id, field_label: 负责人, data_type: ref}
      - {field_key: predecessors, field_label: 前置任务, data_type: json}
      - {field_key: successors, field_label: 后置任务, data_type: json}
      - {field_key: constraint_type, field_label: 约束类型, data_type: enum, options_json: '["ASAP","ALAP","SNET","FNLT"]'}
      - {field_key: constraint_date, field_label: 约束日期, data_type: date}
      # --- 依赖类型（致命缺失补全） ---
      - {field_key: dependency_type, field_label: 依赖类型, data_type: enum, options_json: '["FS","FF","SS","SF"]'}
      - {field_key: lead_lag, field_label: 提前量/滞后量(天), data_type: int}
      # --- 资源加载 ---
      - {field_key: resource_assignments, field_label: 资源加载, data_type: json}
      # --- 关键路径与浮动时间 ---
      - {field_key: is_critical_path, field_label: 是否关键路径, data_type: bool, default_value: "false"}
      - {field_key: total_float, field_label: 总浮动时间(天), data_type: decimal}
      - {field_key: free_float, field_label: 自由浮动时间(天), data_type: decimal}
      # --- 进度基线与实际 ---
      - {field_key: baseline_start, field_label: 基线开始日期, data_type: date}
      - {field_key: baseline_finish, field_label: 基线完成日期, data_type: date}
      - {field_key: actual_start, field_label: 实际开始日期, data_type: date}
      - {field_key: actual_finish, field_label: 实际完成日期, data_type: date}
      # --- 任务类型 ---
      - {field_key: task_type, field_label: 任务类型, data_type: enum, options_json: '["fixed_duration","fixed_work","fixed_units"]'}
      # --- 跨模块联动：关联交付物（任务完成自动触发交付物检入） ---
      - {field_key: deliverable_id, field_label: 关联交付物, data_type: ref}
    states: [planned, in_progress, completed, overdue]
    workflows: [schedule_baseline]

  - entity_type: milestone
    module: schedule
    name: 里程碑
    icon: flag
    icon_color: "#F56C6C"
    fields:
      - {field_key: code, field_label: 里程碑编号, data_type: string}
      - {field_key: due_date, field_label: 截止日期, data_type: date}
      - {field_key: is_critical, field_label: 是否关键, data_type: bool, default_value: "false"}
      - {field_key: deliverable_id, field_label: 关联交付物, data_type: ref}
      # --- 补血字段 ---
      - {field_key: description, field_label: 里程碑描述, data_type: text}
      - {field_key: owner_id, field_label: 负责人, data_type: ref}
      - {field_key: baseline_date, field_label: 基线日期, data_type: date}
      - {field_key: actual_date, field_label: 实际达成日期, data_type: date}
    states: [planned, achieved, missed]
